name: Frameflow release integrity

on:
  push:
    branches: [frameflow-build]
    paths:
      - 'frameflow/**'
      - '.github/workflows/frameflow-release-integrity.yml'
  pull_request:
    paths:
      - 'frameflow/**'
      - '.github/workflows/frameflow-release-integrity.yml'

concurrency:
  group: frameflow-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Reject unfinished shipping code
        run: |
          set -euo pipefail
          SRC=frameflow/app/src/main/java/com/frameflow/app
          # `placeholder = { ... }` is a legitimate Compose text-field API, so do not
          # treat that identifier as unfinished functionality. Reject actual stub
          # markers and user-visible deferrals instead.
          if grep -RniE '\b(TODO|FIXME|coming soon|not implemented|prototype only|stub only|fake implementation)\b' "$SRC"; then
            echo 'Frameflow shipping source still contains unfinished-feature markers.' >&2
            exit 1
          fi
          if grep -RniE '\b(FullEditorScreen|EditorScreen)\b' "$SRC"; then
            echo 'Frameflow still references an obsolete editor implementation.' >&2
            exit 1
          fi
      - name: Android Lint
        working-directory: frameflow
        run: gradle --no-daemon lintDebug
      - name: Unit regressions
        working-directory: frameflow
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble release candidate
        working-directory: frameflow
        run: gradle --no-daemon assembleDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-lint-reports
          path: frameflow/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
