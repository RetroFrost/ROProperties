name: Frameflow interaction

on:
  push:
    branches: [frameflow-build]
    paths:
      - 'frameflow/**'
      - 'settings.gradle.kts'
      - '.github/workflows/frameflow-interaction.yml'
      - '.github/scripts/frameflow-interaction.sh'
      - '.github/scripts/frameflow-rc-source-patch.py'
  pull_request:
    paths:
      - 'frameflow/**'
      - 'settings.gradle.kts'
      - '.github/workflows/frameflow-interaction.yml'
      - '.github/scripts/frameflow-interaction.sh'
      - '.github/scripts/frameflow-rc-source-patch.py'

concurrency:
  group: frameflow-interaction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frameflow-build
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply staged RC source fixes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/frameflow-rc-source-patch.py ]; then
            python3 .github/scripts/frameflow-rc-source-patch.py
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace
            rm .github/scripts/frameflow-rc-source-patch.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frameflow/app/src/main/java/com/frameflow/app/MediaExporter.kt frameflow/app/src/main/java/com/frameflow/app/ProjectRepository.kt .github/scripts/frameflow-rc-source-patch.py
            git commit -m 'Fix GIF sizing and multi-audio duplication'
            git push origin HEAD:frameflow-build
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run editor interaction regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/frameflow-interaction.sh

      - name: Upload interaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-interaction-diagnostics
          path: |
            ci-artifacts/**
            frameflow/app/build/reports/androidTests/**
            frameflow/app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
