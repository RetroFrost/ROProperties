name: Frameflow build and unit

on:
  push:
    branches: [frameflow-build]
    paths:
      - 'frameflow/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'frameflow/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: frameflow-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit and regression tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Assemble RC APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload RC APK
        uses: actions/upload-artifact@v4
        with:
          name: Frameflow-RC-debug
          path: frameflow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-unit-reports
          path: frameflow/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
