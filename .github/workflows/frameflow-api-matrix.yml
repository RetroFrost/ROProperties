name: Frameflow API matrix

on:
  push:
    branches: [frameflow-build]
    paths:
      - 'frameflow/**'
      - '.github/workflows/frameflow-api-matrix.yml'
  pull_request:
    paths:
      - 'frameflow/**'
      - '.github/workflows/frameflow-api-matrix.yml'

concurrency:
  group: frameflow-api-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile tests and APK
        working-directory: frameflow
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: frameflow-matrix-apk
          path: frameflow/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  launch-matrix:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frameflow-matrix-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold launch and lifecycle smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK=$(find apk -name '*.apk' -type f | head -1)
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.frameflow.app
            adb shell am start -W -n com.frameflow.app/.MainActivity
            sleep 4
            adb shell pidof com.frameflow.app >/dev/null
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell am start -W -n com.frameflow.app/.MainActivity
            sleep 2
            adb shell pidof com.frameflow.app >/dev/null
            if adb logcat -d -v brief AndroidRuntime:E '*:S' | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -v threadtime AndroidRuntime:E '*:S'
              exit 1
            fi
