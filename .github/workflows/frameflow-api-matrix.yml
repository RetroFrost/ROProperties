name: Frameflow API matrix

on:
  push:
    branches: [frameflow-build]
    paths:
      - 'frameflow/**'
      - 'settings.gradle.kts'
      - '.github/workflows/frameflow-api-matrix.yml'
      - '.github/scripts/frameflow-api-launch.sh'
  pull_request:
    paths:
      - 'frameflow/**'
      - 'settings.gradle.kts'
      - '.github/workflows/frameflow-api-matrix.yml'
      - '.github/scripts/frameflow-api-launch.sh'

concurrency:
  group: frameflow-api-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble once for matrix
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: frameflow-matrix-apk
          path: frameflow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  launch:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frameflow-matrix-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and lifecycle on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: FRAMEFLOW_API=${{ matrix.api }} bash .github/scripts/frameflow-api-launch.sh
      - name: Upload API ${{ matrix.api }} diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-api-${{ matrix.api }}-diagnostics
          path: ci-artifacts/**
          if-no-files-found: ignore
          retention-days: 14
